<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests Automáticos - LogicaFake (PBIO)</title>
    <style>
        :root {
            --primary: #0284c7;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        .contenedor {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin-top: 0;
            color: var(--text);
            font-size: 1.6rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.75rem;
        }

        .badge-estado {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 600;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .badge-pendiente {
            background-color: #fef3c7;
            color: #92400e;
        }

        .badge-exito {
            background-color: #dcfce7;
            color: #166534;
        }

        .badge-fallo {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .test-item {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 5px solid;
            background-color: #f8fafc;
        }

        .test-pass {
            border-left-color: var(--success);
            background-color: #f0fdf4;
        }

        .test-fail {
            border-left-color: var(--danger);
            background-color: #fef2f2;
        }

        .test-detalle {
            margin: 0.5rem 0 0 0;
            font-family: monospace;
            font-size: 0.85rem;
            color: #475569;
        }

        .acciones {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <header>
            <h1>Biometría y Medio Ambiente: Tests de Verificación de LogicaFake</h1>
            <p>Comprobación automática de las llamadas de abstracción sin peticiones HTTP directas.</p>
        </header>

        <div id="badge-estado" class="badge-estado badge-pendiente">
            Ejecutando batería de tests automáticos...
        </div>

        <section id="resultados-tests" aria-live="polite">
            <!-- Los resultados de los tests se insertan dinámicamente aquí -->
        </section>

        <div class="acciones">
            <button onclick="location.reload()">Reejecutar Tests</button>
            <a href="../Aplicacion.html">Ir a la Aplicación Principal &rarr;</a>
        </div>
    </div>

    <!-- Scripts requeridos: funciones de abstracción de la lógica y suite de tests -->
    <script src="guardarMedicion.js"></script>
    <script src="obtenerMediciones.js"></script>
    <script src="test_logicaFake.js"></script>
</body>
</html>
